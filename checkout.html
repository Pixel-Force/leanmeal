<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — LeanMeal: Healthy &amp; Clean</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="lm-header">
    <div class="lm-container lm-header-inner">
      <a href="index.html" class="lm-logo" aria-label="Lean Meal: Healthy &amp; Clean">
        <img src="assets/images/logo.png" alt="Lean Meal: Healthy &amp; Clean" class="lm-logo-img" />
      </a>

      <nav class="lm-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about-us.html">About Us</a>
        <a href="our-menu.html">Our Menu</a>
        <a href="meal-plan.html">Meal Plan</a>
        <a href="shop.html">Weekly Plans</a>
        <a href="contact-us.html">Contact Us</a>
        <a href="account.html">My Account</a>
      </nav>

      <div class="lm-header-actions">
        <button type="button" class="lm-cart-btn" data-open-cart aria-label="Open shopping bag">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="lm-cart-badge" data-cart-count style="display:none;">0</span>
        </button>
        <a href="our-menu.html" class="lm-btn lm-btn-outline lm-btn-sm">Keep Shopping</a>
      </div>
    </div>
  </header>

  <section class="lm-page-banner">
    <div class="lm-container">
      <div class="lm-breadcrumb"><a href="index.html">Home</a> <span>›</span> <span>Checkout</span></div>
      <h1>Secure Checkout</h1>
    </div>
  </section>

  <main class="lm-section lm-section-mist">
    <div class="lm-container" id="lm-checkout-root"></div>
  </main>

  <footer class="lm-footer">
    <div class="lm-container">
      <div class="lm-footer-bottom" style="padding-top:0;">
        <span>&copy; 2026 LeanMeal: Healthy &amp; Clean. All Rights Reserved.</span>
        <span>Ontario HST (13%) Included at Final Step</span>
      </div>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const Data = window.LEANMEAL_DATA;
      const App = window.LeanMealApp;
      const root = document.getElementById('lm-checkout-root');

      let promoCode = '';
      let fulfillment = 'delivery';

      function render() {
        const cart = App.getCart();
        const totals = App.getCartTotals(promoCode);
        const user = App.getUser() || {};

        if (cart.length === 0) {
          root.innerHTML = `
            <div class="lm-form-card" style="text-align:center; max-width:600px; margin:0 auto;">
              <h2 class="lm-serif" style="margin:0 0 10px; font-size:2rem;">Your Bag is Empty</h2>
              <p style="color:var(--lm-muted); margin:0 0 22px;">
                Add dishes from Our Menu, select a Weekly 5-Day Plan, or customize a 6–24 meal box.
              </p>
              <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
                <a href="meal-plan.html" class="lm-btn lm-btn-primary">Build Custom Meal Plan</a>
                <a href="our-menu.html" class="lm-btn lm-btn-outline">Browse Menu</a>
              </div>
            </div>
          `;
          return;
        }

        const schedule = App.computeDeliverySchedule(totals.count);

        root.innerHTML = `
          <form id="lm-checkout-form" class="lm-two-col">
            <div class="lm-form-card" style="display:grid; gap:20px;">
              <div>
                <h2 class="lm-serif" style="margin:0 0 6px; font-size:1.85rem;">1. Contact &amp; Fulfillment</h2>
                <div class="lm-form-grid" style="margin-top:14px;">
                  <div class="lm-field full">
                    <label>Full Name *</label>
                    <input id="ck-name" class="lm-input" required value="${App.escapeHtml(user.name || '')}" placeholder="Jordan Taylor" />
                  </div>
                  <div class="lm-field">
                    <label>Email Address *</label>
                    <input id="ck-email" type="email" class="lm-input" required value="${App.escapeHtml(user.email || '')}" placeholder="jordan@example.com" />
                  </div>
                  <div class="lm-field">
                    <label>Phone Number *</label>
                    <input id="ck-phone" type="tel" class="lm-input" required value="${App.escapeHtml(user.phone || '')}" placeholder="(365) 779-0273" />
                  </div>
                </div>
              </div>

              <div class="lm-plate-box" style="margin:0;">
                <label style="display:block; font-weight:700; margin-bottom:10px;">Delivery or Partner Hub Pickup</label>
                <div style="display:flex; gap:18px; flex-wrap:wrap; margin-bottom:12px;">
                  <label style="cursor:pointer;"><input type="radio" name="ck-fulfill" value="delivery" ${fulfillment === 'delivery' ? 'checked' : ''} /> Doorstep Delivery (Free)</label>
                  <label style="cursor:pointer;"><input type="radio" name="ck-fulfill" value="pickup" ${fulfillment === 'pickup' ? 'checked' : ''} /> Partner Hub Pickup (Free)</label>
                </div>
                ${fulfillment === 'delivery' ? `
                  <div class="lm-form-grid">
                    <div class="lm-field">
                      <label>Street Address *</label>
                      <input id="ck-addr" class="lm-input" required value="${App.escapeHtml(user.address || '')}" placeholder="128 Queen St S, Mississauga" />
                    </div>
                    <div class="lm-field">
                      <label>Next Fresh Drop Date</label>
                      <input class="lm-input" readonly value="${App.escapeHtml(schedule.drops[0].formatted)}" />
                    </div>
                  </div>
                ` : `
                  <div class="lm-field">
                    <label>Select Partner Pickup Location</label>
                    <select id="ck-hub" class="lm-select">
                      ${Data.partners.map(p => `<option value="${p.id}">${App.escapeHtml(p.name)} — ${App.escapeHtml(p.address)}</option>`).join('')}
                    </select>
                  </div>
                `}
              </div>

              <div>
                <h2 class="lm-serif" style="margin:0 0 10px; font-size:1.85rem;">2. Payment Details (Demo)</h2>
                <div class="lm-form-grid">
                  <div class="lm-field full">
                    <label>Card Number *</label>
                    <input id="ck-card" class="lm-input" required placeholder="4242 •••• •••• 4242" maxlength="19" />
                  </div>
                  <div class="lm-field">
                    <label>Expiry (MM/YY) *</label>
                    <input class="lm-input" required placeholder="09/28" maxlength="5" />
                  </div>
                  <div class="lm-field">
                    <label>CVC *</label>
                    <input class="lm-input" required placeholder="123" maxlength="4" />
                  </div>
                </div>
              </div>
            </div>

            <aside class="lm-summary-box">
              <h3 style="margin:0 0 16px;">Order Summary</h3>
              <div style="display:grid; gap:10px; margin-bottom:16px;">
                ${cart.map(it => `
                  <div style="display:flex; justify-content:space-between; font-size:0.86rem;">
                    <span>${it.qty}× ${App.escapeHtml(it.name)}</span>
                    <strong>${App.formatCAD(it.price * it.qty)}</strong>
                  </div>
                `).join('')}
              </div>

              <div class="lm-line-row"><span>Subtotal</span><span>${App.formatCAD(totals.subtotal)}</span></div>
              ${totals.discount > 0 ? `<div class="lm-line-row" style="color:var(--lm-forest);"><span>Promo Discount</span><strong>−${App.formatCAD(totals.discount)}</strong></div>` : ''}
              <div class="lm-line-row"><span>Delivery</span><span style="color:var(--lm-forest); font-weight:600;">FREE</span></div>
              <div class="lm-line-row"><span>Ontario HST (13%)</span><span>${App.formatCAD(totals.tax)}</span></div>
              <div class="lm-line-row total"><span>Grand Total</span><span>${App.formatCAD(totals.total)}</span></div>

              <div style="display:flex; gap:8px; margin:16px 0;">
                <input id="ck-promo" class="lm-input" placeholder="Promo: LEAN10" value="${App.escapeHtml(promoCode)}" />
                <button type="button" id="ck-apply-promo" class="lm-btn lm-btn-outline lm-btn-sm">Apply</button>
              </div>

              <button type="submit" class="lm-btn lm-btn-primary" style="width:100%;">Complete Order</button>
            </aside>
          </form>
        `;

        document.querySelectorAll('[name="ck-fulfill"]').forEach(r => {
          r.addEventListener('change', (e) => {
            fulfillment = e.target.value;
            render();
          });
        });

        document.getElementById('ck-apply-promo').addEventListener('click', () => {
          const val = document.getElementById('ck-promo').value.trim().toUpperCase();
          if (!val || !Data.promoCodes[val]) {
            App.showToast('Invalid promo code. Try LEAN10, FRESH15, or WELCOME5.');
            promoCode = '';
          } else {
            promoCode = val;
            App.showToast(`Applied ${Data.promoCodes[val].label}`);
          }
          render();
        });

        document.getElementById('lm-checkout-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const orderId = 'LM-' + Math.floor(100000 + Math.random() * 900000);
          App.saveOrder({
            id: orderId,
            type: 'Menu & Weekly Plan Order',
            createdAt: new Date().toISOString(),
            status: 'Confirmed — Preparing',
            items: cart,
            fulfillment,
            schedule: schedule.drops,
            totals
          });
          App.clearCart();
          root.innerHTML = `
            <div class="lm-form-card" style="text-align:center; max-width:620px; margin:0 auto;">
              <div style="width:64px; height:64px; border-radius:50%; background:var(--lm-lime); color:var(--lm-forest); display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 14px;">✓</div>
              <span class="lm-eyebrow">Order Confirmed</span>
              <h2 class="lm-serif" style="margin:10px 0 8px; font-size:2.1rem;">Order ${orderId} Placed!</h2>
              <p style="color:var(--lm-muted); margin:0 0 22px;">
                Grand Total: <strong>${App.formatCAD(totals.total)}</strong> · Scheduled for ${App.escapeHtml(schedule.drops[0].formatted)}.
              </p>
              <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
                <a href="account.html" class="lm-btn lm-btn-primary">Track in My Account</a>
                <a href="index.html" class="lm-btn lm-btn-outline">Return Home</a>
              </div>
            </div>
          `;
        });
      }

      render();
    });
  </script>
</body>
</html>
